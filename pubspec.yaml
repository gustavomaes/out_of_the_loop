name: outoftheloop
description: "Offline Classic party game for 3–20 players."
publish_to: 'none'
version: 1.2.1+7

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.6.0
  firebase_analytics: ^12.4.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  in_app_review: ^2.0.11
  intl: any
  purchases_flutter: ^10.17.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/emoji/
    - assets/images/app_icon.png
    - assets/sounds/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
